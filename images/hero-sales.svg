<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="funnelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1f2a37;stop-opacity:0.9" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4c430;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4c430;stop-opacity:0.7" />
    </linearGradient>

    <!-- Animation for flowing dots -->
    <keyframes id="flowAnimation">
      <keyframe offset="0%">
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" />
      </keyframe>
    </keyframes>

    <!-- Particle animation -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern for subtle background -->
    <pattern id="dotPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#e5e7eb" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="#ffffff" />
  <rect width="600" height="450" fill="url(#dotPattern)" />

  <!-- Subtle accent shapes -->
  <circle cx="100" cy="80" r="120" fill="#0d9488" opacity="0.05" />
  <circle cx="550" cy="350" r="150" fill="#f4c430" opacity="0.03" />

  <!-- Main Funnel Structure -->
  <g id="funnel">
    <!-- Top wide section -->
    <path d="M 150 80 L 450 80 L 420 150 L 180 150 Z" fill="url(#funnelGradient)" stroke="#0d9488" stroke-width="2" opacity="0.8" />
    
    <!-- Top section label indicator -->
    <rect x="150" y="80" width="300" height="5" fill="#f4c430" opacity="0.6" />

    <!-- Middle-top section -->
    <path d="M 180 150 L 420 150 L 380 220 L 220 220 Z" fill="#0d9488" stroke="#0d9488" stroke-width="1.5" opacity="0.7" />
    
    <!-- Middle section label indicator -->
    <rect x="180" y="150" width="240" height="4" fill="#f4c430" opacity="0.5" />

    <!-- Middle-bottom section -->
    <path d="M 220 220 L 380 220 L 340 290 L 260 290 Z" fill="#0d9488" stroke="#0d9488" stroke-width="1.5" opacity="0.6" />
    
    <!-- Middle-bottom section label indicator -->
    <rect x="220" y="220" width="160" height="4" fill="#f4c430" opacity="0.4" />

    <!-- Bottom narrow section -->
    <path d="M 260 290 L 340 290 L 320 360 L 280 360 Z" fill="#0d9488" stroke="#0d9488" stroke-width="1.5" opacity="0.5" />
    
    <!-- Bottom section label indicator -->
    <rect x="260" y="290" width="80" height="4" fill="#f4c430" opacity="0.3" />

    <!-- Final conversion section -->
    <path d="M 280 360 L 320 360 L 315 405 L 285 405 Z" fill="#f4c430" stroke="#f4c430" stroke-width="2" opacity="0.9" />
  </g>

  <!-- Flowing dots/leads - Layer 1 (Top section) -->
  <circle cx="220" cy="105" r="4" fill="#f4c430" opacity="0" filter="url(#glow)">
    <animate attributeName="cy" values="85;155" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <circle cx="300" cy="110" r="4" fill="#f4c430" opacity="0" filter="url(#glow)">
    <animate attributeName="cy" values="85;155" dur="2.5s" begin="0.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.5s" begin="0.4s" repeatCount="indefinite" />
  </circle>

  <circle cx="380" cy="100" r="4" fill="#f4c430" opacity="0" filter="url(#glow)">
    <animate attributeName="cy" values="85;155" dur="2.5s" begin="0.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="2.5s" begin="0.8s" repeatCount="indefinite" />
  </circle>

  <!-- Flowing dots - Layer 2 (Middle-top section) -->
  <circle cx="260" cy="160" r="3.5" fill="#f4c430" opacity="0" filter="url(#glow)">
    <animate attributeName="cy" values="155;225" dur="2.2s" begin="0.3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="2.2s" begin="0.3s" repeatCount="indefinite" />
  </circle>

  <circle cx="340" cy="165" r="3.5" fill="#f4c430" opacity="0" filter="url(#glow)">
    <animate attributeName="cy" values="155;225" dur="2.2s" begin="0.7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="2.2s" begin="0.7s" repeatCount="indefinite" />
  </circle>

  <!-- Flowing dots - Layer 3 (Middle section) -->
  <circle cx="300" cy="235" r="3" fill="#f4c430" opacity="0" filter="url(#glow)">
    <animate attributeName="cy" values="220;295" dur="2s" begin="0.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="2s" begin="0.5s" repeatCount="indefinite" />
  </circle>

  <!-- Flowing dots - Layer 4 (Bottom section) -->
  <circle cx="290" cy="305" r="2.5" fill="#f4c430" opacity="0" filter="url(#glow)">
    <animate attributeName="cy" values="295;365" dur="1.8s" begin="0.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.6;0.6;0" dur="1.8s" begin="0.6s" repeatCount="indefinite" />
  </circle>

  <circle cx="310" cy="310" r="2.5" fill="#f4c430" opacity="0" filter="url(#glow)">
    <animate attributeName="cy" values="295;365" dur="1.8s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.6;0.6;0" dur="1.8s" begin="1s" repeatCount="indefinite" />
  </circle>

  <!-- Flowing dots - Final conversion -->
  <circle cx="300" cy="370" r="2" fill="#111827" opacity="0" filter="url(#glow)">
    <animate attributeName="cy" values="365;410" dur="1.5s" begin="0.7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" begin="0.7s" repeatCount="indefinite" />
  </circle>

  <!-- Growth chart element - Right side -->
  <g id="chart">
    <!-- Chart background -->
    <rect x="420" y="80" width="160" height="150" fill="none" stroke="#e5e7eb" stroke-width="1.5" rx="4" opacity="0.6" />

    <!-- Grid lines -->
    <line x1="420" y1="130" x2="580" y2="130" stroke="#e5e7eb" stroke-width="0.5" opacity="0.4" />
    <line x1="420" y1="165" x2="580" y2="165" stroke="#e5e7eb" stroke-width="0.5" opacity="0.4" />

    <!-- Bar chart - showing growth -->
    <rect x="435" y="190" width="18" height="40" fill="#0d9488" opacity="0.6" rx="2" />
    <rect x="460" y="165" width="18" height="65" fill="#0d9488" opacity="0.7" rx="2" />
    <rect x="485" y="130" width="18" height="100" fill="#0d9488" opacity="0.8" rx="2" />
    <rect x="510" y="90" width="18" height="140" fill="#f4c430" opacity="0.85" rx="2" />
    <rect x="535" y="95" width="18" height="135" fill="#f4c430" opacity="0.9" rx="2" />

    <!-- Upward trend arrow -->
    <polyline points="430,200 450,165 465,175" fill="none" stroke="#f4c430" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <polygon points="465,175 473,168 459,158" fill="#f4c430" opacity="0.8" />
  </g>

  <!-- Conversion funnel at bottom right -->
  <g id="miniChart">
    <!-- Small conversion indicator dots -->
    <circle cx="470" cy="290" r="5" fill="#0d9488" opacity="0.7" />
    <circle cx="500" cy="310" r="4" fill="#0d9488" opacity="0.6" />
    <circle cx="530" cy="330" r="3" fill="#f4c430" opacity="0.8" />
    <circle cx="555" cy="350" r="2.5" fill="#f4c430" opacity="0.9" />

    <!-- Connection lines -->
    <line x1="470" y1="290" x2="500" y2="310" stroke="#0d9488" stroke-width="1.5" opacity="0.5" stroke-dasharray="2,2" />
    <line x1="500" y1="310" x2="530" y2="330" stroke="#0d9488" stroke-width="1.5" opacity="0.5" stroke-dasharray="2,2" />
    <line x1="530" y1="330" x2="555" y2="350" stroke="#f4c430" stroke-width="1.5" opacity="0.5" stroke-dasharray="2,2" />

    <!-- Percentage indicators -->
    <text x="475" y="315" font-size="8" fill="#1f2a37" opacity="0.6" font-family="Arial, sans-serif" font-weight="500">100%</text>
    <text x="505" y="340" font-size="7" fill="#1f2a37" opacity="0.6" font-family="Arial, sans-serif" font-weight="500">65%</text>
    <text x="535" y="365" font-size="7" fill="#1f2a37" opacity="0.6" font-family="Arial, sans-serif" font-weight="500">25%</text>
  </g>

  <!-- Accent lines suggesting movement/energy -->
  <g id="energyLines" opacity="0.4">
    <line x1="150" y1="115" x2="130" y2="100" stroke="#f4c430" stroke-width="1.5" stroke-linecap="round" />
    <line x1="450" y1="120" x2="475" y2="105" stroke="#f4c430" stroke-width="1.5" stroke-linecap="round" />
    <line x1="380" y1="255" x2="405" y2="245" stroke="#f4c430" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
