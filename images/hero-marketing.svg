<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9fafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde047;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4c430;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    
    <filter id="softShadow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles in background -->
  <circle cx="80" cy="80" r="40" fill="#0d9488" opacity="0.05"/>
  <circle cx="520" cy="370" r="50" fill="#f4c430" opacity="0.05"/>
  <circle cx="550" cy="100" r="30" fill="#1f2a37" opacity="0.03"/>
  
  <!-- Flowing connection lines (animated feel) -->
  <defs>
    <path id="flowPath1" d="M 50,200 Q 150,150 250,200 T 450,200" fill="none" stroke="url(#tealGradient)" stroke-width="2" opacity="0.3"/>
    <path id="flowPath2" d="M 80,280 Q 180,250 280,280 T 480,280" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.25"/>
    <path id="flowPath3" d="M 60,350 Q 160,320 260,350 T 460,350" fill="none" stroke="#1f2a37" stroke-width="1.5" opacity="0.15"/>
  </defs>
  
  <use href="#flowPath1"/>
  <use href="#flowPath2"/>
  <use href="#flowPath3"/>
  
  <!-- Animated dots on flow lines -->
  <circle cx="100" cy="200" r="3" fill="#0d9488" opacity="0.6"/>
  <circle cx="200" cy="185" r="2.5" fill="#0d9488" opacity="0.4"/>
  <circle cx="320" cy="200" r="3" fill="#0d9488" opacity="0.6"/>
  <circle cx="420" cy="215" r="2.5" fill="#0d9488" opacity="0.4"/>
  
  <circle cx="130" cy="280" r="3" fill="#f4c430" opacity="0.6"/>
  <circle cx="240" cy="275" r="2.5" fill="#f4c430" opacity="0.4"/>
  <circle cx="350" cy="285" r="3" fill="#f4c430" opacity="0.6"/>
  
  <!-- Email Envelope 1 (Left) -->
  <g filter="url(#softShadow)">
    <!-- Envelope body -->
    <rect x="30" y="80" width="80" height="60" rx="3" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
    <!-- Envelope flap -->
    <path d="M 30,80 L 70,110 L 110,80" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>
    <!-- Envelope line accent -->
    <line x1="30" y1="95" x2="110" y2="95" stroke="#e5e7eb" stroke-width="1"/>
  </g>
  
  <!-- Email Envelope 2 (Center) -->
  <g filter="url(#softShadow)">
    <!-- Envelope body -->
    <rect x="260" y="50" width="80" height="60" rx="3" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
    <!-- Envelope flap -->
    <path d="M 260,50 L 300,80 L 340,50" fill="none" stroke="url(#tealGradient)" stroke-width="2" stroke-linecap="round"/>
    <!-- Envelope line accent -->
    <line x1="260" y1="65" x2="340" y2="65" stroke="#e5e7eb" stroke-width="1"/>
  </g>
  
  <!-- Email Envelope 3 (Right) -->
  <g filter="url(#softShadow)">
    <!-- Envelope body -->
    <rect x="490" y="90" width="80" height="60" rx="3" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
    <!-- Envelope flap -->
    <path d="M 490,90 L 530,120 L 570,90" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>
    <!-- Envelope line accent -->
    <line x1="490" y1="105" x2="570" y2="105" stroke="#e5e7eb" stroke-width="1"/>
  </g>
  
  <!-- Social Media Icons Section -->
  
  <!-- Facebook-like icon -->
  <g filter="url(#softShadow)">
    <rect x="120" y="280" width="50" height="50" rx="4" fill="#1f2a37" opacity="0.9"/>
    <path d="M 135,290 L 135,320 M 128,295 L 142,295" stroke="#f4c430" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- Twitter-like icon -->
  <g filter="url(#softShadow)">
    <rect x="275" y="300" width="50" height="50" rx="4" fill="#0d9488" opacity="0.9"/>
    <path d="M 285,310 L 305,325 M 305,310 L 285,325" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <circle cx="295" cy="317.5" r="3" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Instagram-like icon -->
  <g filter="url(#softShadow)">
    <rect x="430" y="280" width="50" height="50" rx="4" fill="#1f2a37" opacity="0.9"/>
    <rect x="440" y="290" width="30" height="30" rx="6" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.8"/>
    <circle cx="455" cy="305" r="2" fill="#0d9488" opacity="0.8"/>
  </g>
  
  <!-- Connection lines from envelopes to social icons -->
  <!-- Left envelope to Facebook -->
  <path d="M 70,140 Q 90,200 145,280" fill="none" stroke="#f4c430" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4"/>
  
  <!-- Center envelope to Twitter -->
  <path d="M 300,110 Q 300,200 300,300" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4"/>
  
  <!-- Right envelope to Instagram -->
  <path d="M 530,150 Q 510,200 455,280" fill="none" stroke="#f4c430" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,4"/>
  
  <!-- Circular arrow/automation indicator (top right) -->
  <g opacity="0.5">
    <circle cx="520" cy="220" r="25" fill="none" stroke="#1f2a37" stroke-width="1.5" opacity="0.3"/>
    <path d="M 540,210 Q 548,220 540,230" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Central processing node -->
  <g filter="url(#glow)">
    <circle cx="300" cy="220" r="20" fill="white" stroke="url(#goldGradient)" stroke-width="2"/>
    <circle cx="300" cy="220" r="12" fill="url(#goldGradient)" opacity="0.3"/>
    <!-- Inner dot -->
    <circle cx="300" cy="220" r="4" fill="#f4c430"/>
  </g>
  
  <!-- Connection lines from center node -->
  <line x1="300" y1="220" x2="70" y2="110" stroke="#0d9488" stroke-width="1.5" opacity="0.3"/>
  <line x1="300" y1="220" x2="300" y2="80" stroke="#0d9488" stroke-width="1.5" opacity="0.3"/>
  <line x1="300" y1="220" x2="530" y2="120" stroke="#0d9488" stroke-width="1.5" opacity="0.3"/>
  <line x1="300" y1="220" x2="145" y2="305" stroke="#f4c430" stroke-width="1.5" opacity="0.3"/>
  <line x1="300" y1="220" x2="300" y2="325" stroke="#f4c430" stroke-width="1.5" opacity="0.3"/>
  <line x1="300" y1="220" x2="455" y2="305" stroke="#f4c430" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Additional accent dots at connection points -->
  <circle cx="70" cy="110" r="2.5" fill="#0d9488" opacity="0.5"/>
  <circle cx="300" cy="80" r="2.5" fill="#0d9488" opacity="0.5"/>
  <circle cx="530" cy="120" r="2.5" fill="#0d9488" opacity="0.5"/>
  <circle cx="145" cy="305" r="2.5" fill="#f4c430" opacity="0.5"/>
  <circle cx="300" cy="325" r="2.5" fill="#f4c430" opacity="0.5"/>
  <circle cx="455" cy="305" r="2.5" fill="#f4c430" opacity="0.5"/>
  
  <!-- Small pulse circles (automation indicator) -->
  <g opacity="0.6">
    <circle cx="300" cy="220" r="8" fill="none" stroke="#f4c430" stroke-width="1"/>
  </g>
</svg>
