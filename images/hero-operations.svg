<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4c430;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a7f7a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="slateTealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2a37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="#f9fafb"/>

  <!-- Decorative background circles -->
  <circle cx="100" cy="80" r="45" fill="#f4c430" opacity="0.08"/>
  <circle cx="500" cy="380" r="60" fill="#0d9488" opacity="0.08"/>
  <circle cx="550" cy="120" r="35" fill="#1f2a37" opacity="0.06"/>

  <!-- Main Chat Bubble with AI Circuit Pattern -->
  <g id="chatBubble">
    <!-- Outer chat bubble shape -->
    <path d="M 80 80 L 280 80 Q 300 80 300 100 L 300 280 Q 300 300 280 300 L 160 300 L 120 340 L 140 300 L 100 300 Q 80 300 80 280 L 80 100 Q 80 80 100 80 Z" 
          fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    
    <!-- Inner gradient background for chat bubble -->
    <path d="M 85 85 L 280 85 Q 295 85 295 100 L 295 280 Q 295 295 280 295 L 160 295 L 125 335 L 140 295 L 100 295 Q 85 295 85 280 L 85 100 Q 85 85 100 85 Z" 
          fill="url(#slateTealGradient)" opacity="0.15"/>

    <!-- Circuit Pattern Elements (AI/Tech visualization) -->
    <!-- Horizontal circuit line 1 -->
    <line x1="110" y1="140" x2="270" y2="140" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Vertical connector -->
    <line x1="110" y1="140" x2="110" y2="210" stroke="#f4c430" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Horizontal circuit line 2 -->
    <line x1="110" y1="210" x2="270" y2="210" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Diagonal connector -->
    <line x1="190" y1="140" x2="230" y2="210" stroke="#f4c430" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Vertical connector right -->
    <line x1="270" y1="140" x2="270" y2="210" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>

    <!-- Circuit node points - Gold -->
    <circle cx="110" cy="140" r="5" fill="#f4c430" filter="url(#glow)"/>
    <circle cx="270" cy="140" r="5" fill="#f4c430" filter="url(#glow)"/>
    <circle cx="110" cy="210" r="5" fill="#f4c430" filter="url(#glow)"/>
    <circle cx="270" cy="210" r="5" fill="#f4c430" filter="url(#glow)"/>
    
    <!-- Additional circuit nodes - Teal -->
    <circle cx="190" cy="140" r="3.5" fill="#0d9488" opacity="0.8"/>
    <circle cx="230" cy="175" r="3.5" fill="#0d9488" opacity="0.8"/>
    <circle cx="190" cy="210" r="3.5" fill="#0d9488" opacity="0.8"/>

    <!-- Small AI pattern details -->
    <g opacity="0.5">
      <rect x="120" y="155" width="8" height="8" fill="none" stroke="#0d9488" stroke-width="1"/>
      <rect x="245" y="190" width="8" height="8" fill="none" stroke="#f4c430" stroke-width="1"/>
      <rect x="150" y="225" width="8" height="8" fill="none" stroke="#0d9488" stroke-width="1"/>
    </g>
  </g>

  <!-- Connecting lines to gear elements -->
  <line x1="320" y1="150" x2="380" y2="150" stroke="#0d9488" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="320" y1="240" x2="380" y2="240" stroke="#f4c430" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>

  <!-- Gear 1 - Upper Right -->
  <g id="gear1">
    <!-- Gear outer circle -->
    <circle cx="450" cy="150" r="35" fill="none" stroke="#1f2a37" stroke-width="2.5"/>
    
    <!-- Gear teeth -->
    <rect x="443" y="108" width="14" height="12" fill="#1f2a37" rx="2"/>
    <rect x="460" y="120" width="12" height="14" fill="#1f2a37" rx="2" transform="rotate(45 466 127)"/>
    <rect x="468" y="140" width="14" height="12" fill="#1f2a37" rx="2"/>
    <rect x="460" y="165" width="12" height="14" fill="#1f2a37" rx="2" transform="rotate(45 466 172)"/>
    <rect x="443" y="177" width="14" height="12" fill="#1f2a37" rx="2"/>
    <rect x="423" y="165" width="12" height="14" fill="#1f2a37" rx="2" transform="rotate(45 429 172)"/>
    <rect x="415" y="140" width="14" height="12" fill="#1f2a37" rx="2"/>
    <rect x="423" y="120" width="12" height="14" fill="#1f2a37" rx="2" transform="rotate(45 429 127)"/>
    
    <!-- Inner circle with gradient -->
    <circle cx="450" cy="150" r="18" fill="url(#goldGradient)" opacity="0.9"/>
    <circle cx="450" cy="150" r="15" fill="#f4c430" opacity="0.4"/>
    
    <!-- Center dot -->
    <circle cx="450" cy="150" r="4" fill="#111827"/>
  </g>

  <!-- Gear 2 - Lower Right -->
  <g id="gear2">
    <!-- Gear outer circle -->
    <circle cx="450" cy="240" r="30" fill="none" stroke="#0d9488" stroke-width="2"/>
    
    <!-- Gear teeth (smaller, rotated) -->
    <rect x="445" y="203" width="10" height="10" fill="#0d9488" rx="1.5"/>
    <rect x="458" y="212" width="10" height="10" fill="#0d9488" rx="1.5" transform="rotate(45 463 217)"/>
    <rect x="467" y="230" width="10" height="10" fill="#0d9488" rx="1.5"/>
    <rect x="458" y="248" width="10" height="10" fill="#0d9488" rx="1.5" transform="rotate(45 463 253)"/>
    <rect x="445" y="257" width="10" height="10" fill="#0d9488" rx="1.5"/>
    <rect x="432" y="248" width="10" height="10" fill="#0d9488" rx="1.5" transform="rotate(45 437 253)"/>
    <rect x="423" y="230" width="10" height="10" fill="#0d9488" rx="1.5"/>
    <rect x="432" y="212" width="10" height="10" fill="#0d9488" rx="1.5" transform="rotate(45 437 217)"/>
    
    <!-- Inner circle -->
    <circle cx="450" cy="240" r="14" fill="url(#tealGradient)" opacity="0.85"/>
    <circle cx="450" cy="240" r="11" fill="#0d9488" opacity="0.35"/>
    
    <!-- Center dot -->
    <circle cx="450" cy="240" r="3.5" fill="#111827"/>
  </g>

  <!-- Process flow boxes -->
  <!-- Box 1 -->
  <g id="processBox1">
    <rect x="520" y="130" width="50" height="40" fill="#e5e7eb" stroke="#1f2a37" stroke-width="1.5" rx="4"/>
    <circle cx="535" cy="145" r="3.5" fill="#f4c430"/>
    <circle cx="545" cy="150" r="2" fill="#0d9488" opacity="0.7"/>
    <circle cx="540" cy="160" r="2.5" fill="#1f2a37" opacity="0.6"/>
  </g>

  <!-- Box 2 -->
  <g id="processBox2">
    <rect x="520" y="220" width="50" height="40" fill="#f4c430" opacity="0.15" stroke="#f4c430" stroke-width="1.5" rx="4"/>
    <circle cx="535" cy="235" r="3.5" fill="#0d9488"/>
    <circle cx="545" cy="240" r="2" fill="#1f2a37" opacity="0.7"/>
    <circle cx="540" cy="250" r="2.5" fill="#f4c430" opacity="0.6"/>
  </g>

  <!-- Arrow from gear to process boxes -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1f2a37" opacity="0.5"/>
    </marker>
  </defs>
  
  <line x1="485" y1="150" x2="515" y2="150" stroke="#1f2a37" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" marker-end="url(#arrowhead)"/>
  <line x1="485" y1="240" x2="515" y2="240" stroke="#1f2a37" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" marker-end="url(#arrowhead)"/>

  <!-- Workflow automation indicator lines -->
  <g opacity="0.4">
    <line x1="420" y1="130" x2="430" y2="140" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="430" y1="140" x2="420" y2="150" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round"/>
    
    <line x1="420" y1="250" x2="430" y2="240" stroke="#f4c430" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="430" y1="240" x2="420" y2="230" stroke="#f4c430" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Data flow wave elements (left side) -->
  <g opacity="0.3">
    <path d="M 50 200 Q 60 190 70 200 T 90 200" stroke="#0d9488" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 40 220 Q 50 210 60 220 T 80 220" stroke="#f4c430" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 45 240 Q 55 230 65 240 T 85 240" stroke="#0d9488" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Top right accent dots -->
  <g opacity="0.5">
    <circle cx="560" cy="85" r="2.5" fill="#f4c430"/>
    <circle cx="575" cy="100" r="2" fill="#0d9488"/>
    <circle cx="585" cy="70" r="1.5" fill="#1f2a37"/>
  </g>

  <!-- Bottom left accent elements -->
  <g opacity="0.4">
    <circle cx="70" cy="350" r="2" fill="#0d9488"/>
    <circle cx="85" cy="360" r="2.5" fill="#f4c430"/>
    <circle cx="55" cy="365" r="1.5" fill="#1f2a37"/>
  </g>
</svg>
