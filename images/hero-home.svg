<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4c430;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a017;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="nodeShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1f2a37;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#1f2a37;stop-opacity:0" />
    </radialGradient>
    
    <!-- Filter for glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="lightGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="450" fill="#ffffff"/>
  
  <!-- Subtle background circuit pattern -->
  <g opacity="0.05" stroke="#1f2a37" stroke-width="1" fill="none">
    <path d="M 50 100 L 150 150 L 200 100"/>
    <path d="M 400 80 L 500 120 L 550 60"/>
    <path d="M 100 350 L 200 320 L 250 380"/>
    <path d="M 450 350 L 520 380 L 550 330"/>
  </g>
  
  <!-- Main lightbulb circuit structure -->
  <g id="lightbulb-structure">
    
    <!-- Lightbulb outline paths (subtle background) -->
    <g stroke="#e5e7eb" stroke-width="2" fill="none" opacity="0.6">
      <!-- Bulb outline -->
      <ellipse cx="300" cy="160" rx="95" ry="110"/>
      <!-- Base lines -->
      <line x1="260" y1="270" x2="260" y2="310"/>
      <line x1="300" y1="270" x2="300" y2="310"/>
      <line x1="340" y1="270" x2="340" y2="310"/>
    </g>
    
    <!-- Connecting circuit lines (teal accent) -->
    <g stroke="url(#tealGrad)" stroke-width="2.5" fill="none" opacity="0.8" stroke-linecap="round">
      <!-- Upper left connections -->
      <path d="M 220 130 Q 240 140 260 150"/>
      <path d="M 210 180 Q 245 175 275 165"/>
      
      <!-- Upper right connections -->
      <path d="M 380 150 Q 360 140 340 130"/>
      <path d="M 390 165 Q 355 175 325 180"/>
      
      <!-- Center circuit paths -->
      <path d="M 260 150 Q 280 155 300 160"/>
      <path d="M 340 150 Q 320 155 300 160"/>
      <path d="M 275 165 Q 290 162 310 162"/>
      <path d="M 325 180 Q 310 177 290 177"/>
      
      <!-- Lower connections -->
      <path d="M 280 240 Q 285 255 290 270"/>
      <path d="M 320 240 Q 315 255 310 270"/>
    </g>
    
    <!-- Node network - Top tier -->
    <circle cx="220" cy="130" r="8" fill="url(#goldGrad)" filter="url(#glow)" stroke="#d4a017" stroke-width="1"/>
    <circle cx="380" cy="130" r="8" fill="url(#tealGrad)" filter="url(#glow)" stroke="#0f766e" stroke-width="1"/>
    
    <!-- Node network - Upper middle tier -->
    <circle cx="210" cy="180" r="7" fill="#f4c430" filter="url(#glow)" stroke="#d4a017" stroke-width="0.8"/>
    <circle cx="390" cy="165" r="7" fill="#0d9488" filter="url(#glow)" stroke="#0f766e" stroke-width="0.8"/>
    
    <!-- Node network - Middle tier (core nodes) -->
    <circle cx="260" cy="150" r="8" fill="url(#goldGrad)" filter="url(#glow)" stroke="#d4a017" stroke-width="1"/>
    <circle cx="340" cy="150" r="8" fill="url(#tealGrad)" filter="url(#glow)" stroke="#0f766e" stroke-width="1"/>
    <circle cx="275" cy="165" r="7" fill="#0d9488" filter="url(#glow)" stroke="#0f766e" stroke-width="0.8"/>
    <circle cx="325" cy="180" r="7" fill="#f4c430" filter="url(#glow)" stroke="#d4a017" stroke-width="0.8"/>
    
    <!-- Central brightened node (heart of automation) -->
    <circle cx="300" cy="160" r="10" fill="url(#goldGrad)" filter="url(#lightGlow)" stroke="#f4c430" stroke-width="2" opacity="0.9"/>
    <circle cx="300" cy="160" r="6" fill="#ffffff" opacity="0.5"/>
    
    <!-- Node network - Lower middle tier -->
    <circle cx="280" cy="240" r="6" fill="#0d9488" filter="url(#glow)" stroke="#0f766e" stroke-width="0.8"/>
    <circle cx="320" cy="240" r="6" fill="#f4c430" filter="url(#glow)" stroke="#d4a017" stroke-width="0.8"/>
    
    <!-- Base nodes (stem connections) -->
    <circle cx="260" cy="310" r="5" fill="#1f2a37" filter="url(#glow)" opacity="0.7"/>
    <circle cx="300" cy="310" r="5" fill="#1f2a37" filter="url(#glow)" opacity="0.7"/>
    <circle cx="340" cy="310" r="5" fill="#1f2a37" filter="url(#glow)" opacity="0.7"/>
    
    <!-- Additional accent nodes for depth -->
    <circle cx="245" cy="200" r="5" fill="#0d9488" opacity="0.6" filter="url(#glow)"/>
    <circle cx="355" cy="195" r="5" fill="#f4c430" opacity="0.6" filter="url(#glow)"/>
  </g>
  
  <!-- Right side gear/circuit accent -->
  <g id="gear-accent">
    <!-- Curved circuit path -->
    <g stroke="url(#tealGrad)" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round">
      <path d="M 480 100 Q 500 110 510 130"/>
      <path d="M 510 200 Q 500 220 480 230"/>
      <path d="M 480 230 Q 460 220 450 200"/>
      <path d="M 450 100 Q 460 110 480 100"/>
    </g>
    
    <!-- Gear-like accent nodes -->
    <circle cx="480" cy="100" r="6" fill="url(#goldGrad)" filter="url(#glow)" stroke="#d4a017" stroke-width="1"/>
    <circle cx="510" cy="130" r="5" fill="#0d9488" opacity="0.7" filter="url(#glow)"/>
    <circle cx="510" cy="200" r="5" fill="#f4c430" opacity="0.7" filter="url(#glow)"/>
    <circle cx="480" cy="230" r="6" fill="url(#tealGrad)" filter="url(#glow)" stroke="#0f766e" stroke-width="1"/>
    <circle cx="450" cy="200" r="5" fill="#0d9488" opacity="0.7" filter="url(#glow)"/>
    <circle cx="450" cy="100" r="5" fill="#f4c430" opacity="0.7" filter="url(#glow)"/>
  </g>
  
  <!-- Left side accent network -->
  <g id="accent-network">
    <!-- Circuit path -->
    <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round">
      <path d="M 120 240 L 140 260 L 160 240"/>
      <path d="M 140 260 L 140 300"/>
    </g>
    
    <!-- Accent nodes -->
    <circle cx="120" cy="240" r="5" fill="#f4c430" filter="url(#glow)" opacity="0.8"/>
    <circle cx="140" cy="260" r="6" fill="url(#tealGrad)" filter="url(#glow)" stroke="#0f766e" stroke-width="1"/>
    <circle cx="160" cy="240" r="5" fill="#0d9488" filter="url(#glow)" opacity="0.8"/>
    <circle cx="140" cy="300" r="5" fill="#f4c430" filter="url(#glow)" opacity="0.7"/>
  </g>
  
  <!-- Floating accent particles for depth -->
  <g id="particles" opacity="0.4">
    <circle cx="350" cy="60" r="3" fill="#0d9488"/>
    <circle cx="420" cy="340" r="2.5" fill="#f4c430"/>
    <circle cx="180" cy="380" r="2.5" fill="#0d9488"/>
    <circle cx="520" cy="290" r="2" fill="#f4c430"/>
    <circle cx="100" cy="130" r="2" fill="#0d9488"/>
  </g>
  
  <!-- Optional subtle animation-ready elements (positioned for motion) -->
  <g id="hover-zone" opacity="0">
    <!-- Central expansion zone -->
    <circle cx="300" cy="160" r="120" fill="none" stroke="transparent"/>
  </g>
</svg>
